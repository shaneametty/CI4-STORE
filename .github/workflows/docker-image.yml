name: Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-file: project.tar
      image-tag: project:test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push, just save)
        run: |
          docker build -t project:test ./backend -f ./backend/Dockerfile
          docker save project:test -o project.tar

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project
          path: project.tar

  mysql-docker-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: project
          path: .

      - name: Load Docker image
        run: docker load -i project.tar

      - name: Start MySQL
        run: docker compose -f compose.yaml up -d mysql

      - name: Show service health
        run: docker compose -f compose.yaml ps

  ci4-docker-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: project
          path: .

      - name: Load Docker image
        run: docker load -i project.tar

      - name: Start CI4 PHP service
        run: docker compose -f compose.yaml up -d php

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: backend/build/logs/clover.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v

  composer-checks:
    name: Composer checks (health and test)
    runs-on: ubuntu-latest
    needs: [ ci4-docker-test, mysql-docker-test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: project
          path: .

      - name: Load Docker image
        run: docker load -i project.tar

      - name: Use testing environment config
        run: cp backend/.env.testing backend/.env

      - name: Start php + mysql + nginx services
        run: docker compose -f compose.yaml up -d mysql php nginx

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL container to be ready..."
          until docker compose -f compose.yaml exec -T mysql sh -c "mysqladmin ping -uroot -proot --silent"; do
            echo "MySQL not ready yet..."
            sleep 2
          done
          docker compose -f compose.yaml ps

      - name: Create test database
        run: |
          docker compose -f compose.yaml exec -T mysql sh -c "mysql -uroot -proot -e \
            \"CREATE DATABASE IF NOT EXISTS app_test; \
            FLUSH PRIVILEGES;\""

      - name: Run composer health inside php container
        run: docker compose exec php composer health

      - name: Run composer test inside php container
        run: docker compose exec php composer test

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v


  db-migration-seed-checks:
    name: DB migration & seed checks
    runs-on: ubuntu-latest
    needs: composer-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: project
          path: .

      - name: Load Docker image
        run: docker load -i project.tar

      - name: Use testing environment config
        run: cp backend/.env.testing backend/.env

      - name: Start php + mysql services
        run: docker compose -f compose.yaml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for containers to be healthy..."
          docker compose -f compose.yaml ps
          until docker compose -f compose.yaml exec -T mysql sh -lc "mysqladmin ping -h 127.0.0.1 -proot --silent"; do
            echo "MySQL not ready yet..."
            sleep 5
          done
          docker compose -f compose.yaml ps

      - name: Run migrations
        run: docker compose -f compose.yaml exec php composer migrate || true

      - name: Show migrations status
        run: docker compose -f compose.yaml exec php composer migrate:status || true

      - name: Assert migration files >1
        run: |
          set -euo pipefail
          COUNT=$(docker compose -f compose.yaml exec -T php sh -lc 'php -r '\''echo count(glob("app/Database/Migrations/*.php")), PHP_EOL;'\''')
          echo "Detected migration files: $COUNT"
          if [ "${COUNT:-0}" -le 1 ]; then
            echo "Need >1 migration files; found: $COUNT"
            exit 1
          fi

      - name: Run seeders
        run: docker compose -f compose.yaml exec php composer seed || true

      - name: Verify at least one table has data
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          TABLES=$(docker compose -f compose.yaml exec -T mysql mysql -uroot -proot app -N -e "SHOW TABLES;")
          FOUND=0
          for T in $TABLES; do
            if [ "$T" = "migrations" ]; then continue; fi
            COUNT=$(docker compose -f compose.yaml exec -T mysql mysql -uroot -proot app -N -e "SELECT COUNT(*) FROM ${T};")
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "Table $T has $COUNT rows"
              FOUND=1
              break
            fi
          done

      - name: Run truncate
        run: docker compose -f compose.yaml exec php composer truncate || true

      - name: Verify all tables empty
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          TABLES=$(docker compose -f compose.yaml exec -T mysql mysql -uroot -proot app -N -e "SHOW TABLES;")
          FAIL=0
          for T in $TABLES; do
            if [ "$T" = "migrations" ]; then continue; fi
            COUNT=$(docker compose -f compose.yaml exec -T mysql mysql -uroot -proot app -N -e "SELECT COUNT(*) FROM ${T};")
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "❌ Table $T is not empty ($COUNT rows)"
              FAIL=1
            fi
          done

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v
